schema-version: 2
name: ceph
# Upstream is the default source repository; override it per descriptor
# component entry or with -o ceph=<uri> when building from a fork.
repo: gh://ceph/ceph

# The version→OS matrix: which target OSes may build a given ceph version,
# and which one is picked by default. Ranges are half-open [from, before).
#
# ceph up to 19.2.4 only builds on el9; from 19.2.5 onwards (including 20.2+
# and the 21.x dev line) el10 is required. Move the boundary by editing the
# ranges — a version in neither range fails loudly at descriptor-create time.
targets:
  - versions: { before: "20.0.0" }
    supported: [el9]
    default: el9
  - versions: { from: "20.0.0" }
    supported: [el10]
    default: el10

build:
  get-version: scripts/get_version.sh
  backends:
    rpm:
      deps: scripts/rpm/install_deps.sh
      build: scripts/rpm/build_rpms.sh
      release-package: scripts/rpm/get_release_rpm.sh

images:
  path: images/
