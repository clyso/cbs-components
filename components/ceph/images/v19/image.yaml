config:
  env:
    CEPH_IS_DEVEL: "False"
    CEPH_REF: "{{ git_ref }}"
    CEPH_VERSION: "{{ git_ref }}"
    CEPH_OSD_FLAVOR: default
    FROM_IMAGE: "{{ base_image }}"
  labels:
    ceph: "True"
    CEPH_REF: "{{ git_ref }}"
    CEPH_SHA1: "{{ git_sha1 }}"
    CEPH_GIT_REPO: "{{ git_repo_url }}"
    # No GANESHA_REPO_BASEURL label: it differs per OS (el9 nfsganesha-5,
    # el10 nfsganesha-9 — see the ganesha*.repo files) and labels cannot be
    # conditional.
    OSD_FLAVOR: default
  annotations:
    com.clyso.ces.ceph.version: "{{ git_ref }}"

pre:
  keys:
    # The location is config-injected (storage.s3.public-url) -- never
    # hardcoded.
    - "{{ artifacts_url }}/keys/release.asc"

  packages:
    - epel-release
    - jq
    - dnf-plugins-core

  repos:
    # Per-OS repo entries are explicit — a new OS must be listed here
    # deliberately, never inherited silently. The el10 entries mirror the
    # v21 recipe and are pending an e2e build validation of 19.2.5+ on el10.
    # el9 keeps the nfsganesha-5 stream this line has always shipped with;
    # el10 uses nfsganesha-9 — the 10-stream nfsganesha-5 repo is effectively
    # empty (4 packages), and upstream main uses nfsganesha-9 on el10.
    - name: ganesha
      source: file://ganesha.repo
      dest: /etc/yum.repos.d/ganesha.repo
      when:
        os: el9

    - name: ganesha
      source: file://ganesha-el10.repo
      dest: /etc/yum.repos.d/ganesha.repo
      when:
        os: el10

    - name: tcmu-runner
      source: https://shaman.ceph.com/api/repos/tcmu-runner/main/latest/centos/{{ os_version }}/repo?arch={{ arch }}
      dest: /etc/yum.repos.d/tcmu-runner.repo
      when:
        os: el9

    - name: tcmu-runner
      source: https://shaman.ceph.com/api/repos/tcmu-runner/main/latest/rocky/{{ os_version }}/repo?arch={{ arch }}
      dest: /etc/yum.repos.d/tcmu-runner.repo
      when:
        os: el10

    - name: ceph-iscsi
      source: https://download.ceph.com/ceph-iscsi/3/rpm/el9/ceph-iscsi.repo
      dest: /etc/yum.repos.d/ceph-iscsi.repo
      when:
        os: el9

    - name: ceph-iscsi
      source: https://shaman.ceph.com/api/repos/ceph-iscsi/main/latest/rocky/{{ os_version }}/repo
      dest: /etc/yum.repos.d/ceph-iscsi.repo
      when:
        os: el10

    # copr is el9-only: el10 ships python3-scikit-learn in the distro repos.
    - name: python-scikit-learn
      source: copr://tchaikov/python-scikit-learn
      when:
        os: el9

packages:
  required:
    - section: general
      packages:
        - ca-certificates

    - section: ceph
      packages:
        - ceph-common
        - ceph-exporter
        - ceph-grafana-dashboards
        - ceph-immutable-object-cache
        - ceph-mds
        - ceph-mgr-cephadm
        - ceph-mgr-dashboard
        # diskprediction_local is broken due to the model being pickled with a
        # really old version of scikit-learn, so we disable it for now, maybe
        # remove it in the future.
        # - ceph-mgr-diskprediction-local
        - ceph-mgr-k8sevents
        - ceph-mgr-rook
        - ceph-mgr
        - ceph-mon
        - ceph-osd
        - ceph-radosgw
        - lua-devel
        - luarocks
        - ceph-volume
        - cephfs-mirror
        - cephfs-top
        - kmod
        - libradosstriper1
        - rbd-mirror

    - section: recommends
      packages:
        - nvme-cli
        - smartmontools

    # python3-saml exists only on el9 (upstream scopes it to el major <= 9);
    # an unconditional entry fails dnf on el10.
    - section: recommends-el9
      when:
        os: el9
      packages:
        - python3-saml

    - section: nfs-ganesha
      when:
        os: [el9, el10]
      packages:
        - dbus-daemon
        - nfs-ganesha-ceph
        - nfs-ganesha-rados-grace
        - nfs-ganesha-rados-urls
        - nfs-ganesha-rgw
        - nfs-ganesha
        - rpcbind
        - sssd-client

    - section: iscsi
      packages:
        - ceph-iscsi
        - tcmu-runner
        - python3-rtslib

    - section: ceph-iscsi
      packages:
        - attr
        - ceph-fuse
        - rbd-nbd

    - section: rook
      packages:
        - systemd-udev

    - section: util
      packages:
        - gdisk
        - hostname
        - procps-ng
        - sg3_utils
        - e2fsprogs
        - lvm2
        - gcc

    - section: scikit-learn
      packages:
        - python3-scikit-learn

    - section: ceph-node-proxy
      packages:
        - ceph-node-proxy

    - section: crimson
      # gated behind the crimson feature (was v1's `cond: with_crimson`)
      when:
        feature: crimson
      packages:
        - ceph-crimson-osd

post:
  - name: ganesha-fixes
    run: fix-ganesha.sh
    when:
      os: [el9, el10]

  # fix-jaraco patches a python3.9 site-packages path for an el9-only
  # packaging bug (rhbz#2324959); it does not apply to el10 (python3.12).
  - name: fix-jaraco
    run: fix-jaraco.sh
    when:
      os: el9

  - name: disable-sync-udev
    run: disable-sync-udev.sh

  - name: cleanup
    run: cleanup.sh
