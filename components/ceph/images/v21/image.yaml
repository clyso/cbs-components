# Ceph 21.x (main / dev line) image recipe — el10 (Rocky Linux 10).
#
# Derived from v20 and adapted for el10. el10 ships python3.12 (v20 / el9
# used python3.9).
#
# Naming: this directory is intentionally major-only ("v21") so that any 21.x
# dev version produced by `ceph@main` resolves to it via the images/index.yaml
# version ranges. When a 21.x release line is cut, add a dedicated recipe
# directory and close this one's range in the index.

config:
  env:
    CEPH_IS_DEVEL: "False"
    CEPH_REF: "{{ git_ref }}"
    CEPH_VERSION: "{{ git_ref }}"
    CEPH_OSD_FLAVOR: default
    FROM_IMAGE: "{{ base_image }}"
  labels:
    ceph: "True"
    CEPH_REF: "{{ git_ref }}"
    CEPH_SHA1: "{{ git_sha1 }}"
    CEPH_GIT_REPO: "{{ git_repo_url }}"
    GANESHA_REPO_BASEURL: https://buildlogs.centos.org/centos/$releasever-stream/storage/$basearch/nfsganesha-9/
    OSD_FLAVOR: default
  annotations:
    com.clyso.ces.ceph.version: "{{ git_ref }}"

pre:
  keys:
    # The location is config-injected (storage.s3.public-url) -- never
    # hardcoded.
    - "{{ artifacts_url }}/keys/release.asc"

  packages:
    - epel-release
    - jq
    - dnf-plugins-core

  repos:
    # el10-scoped repos (the stream-10 ganesha repo, the rocky/10 shaman
    # repos): this recipe carries no el9 content — 21.x is el10-only.
    - name: ganesha
      source: file://ganesha.repo
      dest: /etc/yum.repos.d/ganesha.repo
      when:
        os: el10

    - name: tcmu-runner
      source: https://shaman.ceph.com/api/repos/tcmu-runner/main/latest/rocky/{{ os_version }}/repo?arch={{ arch }}
      dest: /etc/yum.repos.d/tcmu-runner.repo
      when:
        os: el10

    - name: ceph-iscsi
      source: https://shaman.ceph.com/api/repos/ceph-iscsi/main/latest/rocky/{{ os_version }}/repo
      dest: /etc/yum.repos.d/ceph-iscsi.repo
      when:
        os: el10

  scripts:
    - name: disable rpm docs install
      run: setup-no-docs.sh

packages:
  required:
    - section: general
      packages:
        - ca-certificates

    - section: ceph
      packages:
        - ceph-common
        - ceph-exporter
        - ceph-grafana-dashboards
        - ceph-immutable-object-cache
        - ceph-mds
        - ceph-mgr-cephadm
        - ceph-mgr-dashboard
        # diskprediction_local is broken due to the model being pickled with a
        # really old version of scikit-learn, so we disable it for now, maybe
        # remove it in the future.
        # - ceph-mgr-diskprediction-local
        - ceph-mgr-k8sevents
        - ceph-mgr-rook
        - ceph-mgr
        - ceph-mon
        - ceph-osd
        - ceph-radosgw
        - lua-devel
        - luarocks
        - ceph-volume
        - cephfs-mirror
        - cephfs-top
        - kmod
        - libcephfs-daemon
        - libradosstriper1
        - rbd-mirror

    - section: recommends
      packages:
        - nvme-cli
        - python3-ceph-smb-ctl
        - smartmontools

    - section: nfs-ganesha
      when:
        os: el10
      packages:
        - dbus-daemon
        - nfs-ganesha-ceph
        - nfs-ganesha-rados-grace
        - nfs-ganesha-rados-urls
        - nfs-ganesha-rgw
        - nfs-ganesha
        - rpcbind
        - sssd-client

    - section: iscsi
      packages:
        - ceph-iscsi
        - tcmu-runner
        - python3-rtslib

    - section: ceph-iscsi
      packages:
        - attr
        - ceph-fuse
        - rbd-nbd

    - section: rook
      packages:
        - systemd-udev

    - section: util
      packages:
        - gdisk
        - hostname
        - procps-ng
        - sg3_utils
        - e2fsprogs
        - lvm2
        - gcc

    - section: scikit-learn
      # el10 ships python3-scikit-learn in the distro repos; no copr needed
      # (unlike the el9 recipes).
      packages:
        - python3-scikit-learn

    - section: ceph-node-proxy
      packages:
        - ceph-node-proxy

    - section: crimson
      # gated behind the crimson feature (was v1's `cond: with_crimson`)
      when:
        feature: crimson
      packages:
        - ceph-crimson-osd

post:
  - name: ganesha-fixes
    run: fix-ganesha.sh
    when:
      os: el10

  # NOTE(el10): v20's fix-jaraco.sh patched a python3.9 site-packages path for
  # an el9-only bug (rhbz#2324959). It does not apply to el10 (python3.12) and
  # is intentionally dropped here. Re-add an el10 equivalent only if the same
  # packaging bug reappears.

  - name: disable-sync-udev
    run: disable-sync-udev.sh

  - name: cleanup
    run: cleanup.sh
